apply plugin: 'com.android.application'

android {
    namespace 'com.grimorio.torre'
    compileSdk 34

    defaultConfig {
        applicationId "com.grimorio.torre"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "grimorio"
            keyAlias "grimorio"
            keyPassword "grimorio"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:7.1.1'
}
